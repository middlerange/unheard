name = "content-hub"
main = "dist/server/worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[vars]
RESEARCH_DEPTH_MODEL = "claude-sonnet-5-5"
RESEARCH_DEPTH_GROUPING_VERSION = "attributed-quotes-and-questions-v2"
RESEARCH_PACKET_POLICY = "empty-claim-placeholders-v5"

[build]
command = "bun run build"

[assets]
directory = "./dist/client"

[triggers]
crons = ["* * * * *"]

[[workflows]]
binding = "RESEARCH_WORKFLOW"
name = "content-hub-research"
class_name = "ResearchWorkflow"

[[workflows]]
binding = "SLACK_WORKFLOW"
name = "content-hub-slack"
class_name = "SlackWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "content-hub"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle-d1"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "content-hub-media"
